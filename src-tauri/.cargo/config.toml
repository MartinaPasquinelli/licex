[target.aarch64-apple-darwin]
linker = "/opt/homebrew/opt/llvm/bin/clang"

[env]
CC = { value = "/opt/homebrew/opt/llvm/bin/clang", force = true }
CXX = { value = "/opt/homebrew/opt/llvm/bin/clang++", force = true }

# Configurazione per sviluppatori Windows (evita l'errore di percorso lungo MAX_PATH)
[target.'cfg(windows)']
# Nota per Windows: se compili su Windows, puoi usare CARGO_TARGET_DIR="C:/Users/Public/cargo_target/licex-tauri"
