<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kaleidoswap-pictogram.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LicEX - Software License Exchange</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('kaleidoswap_theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
